<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat UI</title>
  <link rel="stylesheet" href="chatstyles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet" />
  <script>
    function updateChatRoom() {
      var selectedRoom = document.getElementById("chatRoomSelect").value;
      document.getElementById("current-room").innerText = selectedRoom;
    }

    function kickUser() {
      var userSelect = document.getElementById("userSelect");
      var selectedUser = userSelect.value;
      if (selectedUser !== "users") {
        alert(selectedUser + " has been kicked out!");
        userSelect.remove(userSelect.selectedIndex);
        document.getElementById("kickButton").style.display = "none";
      }
    }

    function toggleKickButton() {
      var userSelect = document.getElementById("userSelect");
      var kickButton = document.getElementById("kickButton");
      kickButton.style.display = userSelect.value !== "users" ? "inline-block" : "none";
    }
  </script>
  <style>

    /*kick styles*/
    .user-dropdown {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #kickButton {
      display: none;
      background: rgb(239, 33, 33);
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      padding: 6px 10px;
    }
    #kickButton:hover {
      background: rgb(171, 24, 24);
    }
  </style>
</head>
<body>
  <!-- Chat Container -->
  <div class="chat-container">
    <div class="btn-container">
      <button type="cancel">
        <img src="close.png" width=15% alt="Button Image" />
      </button>
    </div>
    <!-- Header -->
    <header>
      <h1>Chat Rooms</h1>
      <!-- Custom Dropdown for Users -->
      <div class="user-dropdown">
        <select id="userSelect" class="dropdown" onchange="toggleKickButton()">
          <option value="users">Users 3/10</option>
          <option value="Jane">Jane</option>
          <option value="Alice">Alice</option>
          <option value="You">You (Admin)</option>
        </select>
        <button id="kickButton" onclick="kickUser()">Kick</button>
      </div>
    </header>

    <!-- Dropdown for Joined Groups -->
    <div class="discussion-bar">
      <h2>Joined Groups</h2>
      <select id="chatRoomSelect" class="dropdown" onchange="updateChatRoom()">
        <option value="Tennis 2/10">Tennis 3/10</option>
        <option value="Badminton 7/10">Badminton 7/10</option>
        <option value="Floorball 11/10">Floorball 11/10</option>
        <option value="Basketball 19/10">Basketball 19/10</option>
        <option value="Frisbee 25/10">Frisbee 25/10</option>
      </select>
    </div>

    <!-- Display Current Chat Room -->
    <div class="current-room-display">
      <h3>Current Chat Room: <span id="current-room">Tennis</span></h3>
    </div>

    <!-- Chat Messages -->
    <div class="chat-box">
      <div class="message jane-msg">
        <div class="username">Jane</div>
        <div class="message-content">Hello!</div>
      </div>
      <div class="message user-msg">
        <div class="username">Alice</div>
        <div class="message-content">What time are we meeting for tennis? 🤔</div>
      </div>
      <div class="message my-msg">
        <div class="username">You</div>
        <div class="message-content">I can't wait to see all of y'all! 🔥</div>
      </div>
    </div>

    <!-- Chat Input -->
    <div class="chat-input">
      <input type="text" id="message" placeholder="Type a message..." />
      <button id="send-btn">Send</button>
    </div>
  </div>
</body>
</html>
